name: Deploy site

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    container: ubuntu
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v2

      - name: Store version info in the environment
        run: echo "VERSION=$(date +'%Y.%m.%d')" >> $GITHUB_ENV

      # Build any WASM packages we have to build
      # - name: Install wasm-pack
      #   uses: jetli/wasm-pack-action@v0.3.0
      #   with:
      #     version: 'latest'
      # - name: Build the game-of-life package
      #   working-directory: src/pkg/game-of-life/rust
      #   run: wasm-pack build --release --out-name index --target bundler .

      # Build the nodejs and deploy it
      - name: Install node
        uses: actions/setup-node@v2
        with:
          node-version: 22
      - run: npm ci

      - name: Install lightpanda headless browser (and other requirements)
        run: |
          apt update -y
          apt install -y curl jq coreutils git
          curl -fsSL https://pkg.lightpanda.io/install.sh | bash

      - name: Build the main site files
        run: |
          # Before running the build, insert the today's date as the version
          sed -i "s/{VERSION}/$VERSION/" .env src/file_system/freyama.de/.changelog.md

          # Build the static files on this branch first
          npm run build

          # Get the rendered html for the noJs and dump it into the file
          npm run preview &
          sleep 5
          $HOME/.local/bin/lightpanda fetch --dump html --wait-ms 10000 --http-timeout 0 --strip-mode js http://localhost:12345/noJs.html | grep -v modulepreload > /tmp/noJs.html
          cat /tmp/noJs.html
          mv /tmp/noJs.html dist/noJs.html

      - name: Deploy the built files
        uses: freyamade/deploy-to-fresh@v1.0.2
        with:
          src: dist
          version: '{{ env.VERSION }}'
          token: '{{ secrets.GITHUB_TOKEN }}'
